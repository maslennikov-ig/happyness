# Основные настройки PostgreSQL для разработки
listen_addresses = '*'
port = 5432
max_connections = 100

# Память
shared_buffers = 128MB              # Для разработки достаточно
work_mem = 8MB                      # Для запросов
maintenance_work_mem = 64MB         # Для обслуживания
dynamic_shared_memory_type = posix  # Тип разделяемой памяти

# Журналирование
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 10MB
log_min_duration_statement = 250ms  # Логировать запросы дольше 250мс
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0

# Параметры WAL
wal_level = replica                 # Минимальный уровень для репликации
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_timeout = 5min
checkpoint_completion_target = 0.9

# Планировщик запросов
random_page_cost = 1.1              # SSD диск
effective_cache_size = 512MB        # Предполагаемый размер кэша ОС

# Автоочистка
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50

# Локализация
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'ru_RU.UTF-8'
lc_monetary = 'ru_RU.UTF-8'
lc_numeric = 'ru_RU.UTF-8'
lc_time = 'ru_RU.UTF-8'

# Настройки для разработки
synchronous_commit = off            # Повышает скорость за счет безопасности (только для разработки!)
full_page_writes = off              # Отключаем для повышения производительности (только для разработки!)

# Настройки для отладки
debug_print_parse = off
debug_print_rewritten = off
debug_print_plan = off
debug_pretty_print = on 