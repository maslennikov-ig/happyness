version: '3.8'

services:
  # Frontend сервис (Next.js)
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      target: production
    container_name: happyness-frontend-prod
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:4000}
    ports:
      - '3100:3100'
    depends_on:
      - backend
    networks:
      - happyness-network

  # Backend сервис (NestJS)
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: production
    container_name: happyness-backend-prod
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-happyness}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-secret}
      - JWT_EXPIRES_IN=1d
    ports:
      - '4000:4000'
    depends_on:
      - postgres
      - redis
    networks:
      - happyness-network

  # PostgreSQL база данных
  postgres:
    image: postgres:15-alpine
    container_name: happyness-postgres-prod
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-happyness}
    volumes:
      - postgres-data-prod:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    networks:
      - happyness-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis для кэширования и сессий
  redis:
    image: redis:7-alpine
    container_name: happyness-redis-prod
    restart: always
    volumes:
      - redis-data-prod:/data
    ports:
      - '6379:6379'
    networks:
      - happyness-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx для проксирования запросов и обслуживания статических файлов
  nginx:
    image: nginx:1.25-alpine
    container_name: happyness-nginx-prod
    restart: always
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
      - frontend-build:/var/www/html
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - frontend
      - backend
    networks:
      - happyness-network

networks:
  happyness-network:
    driver: bridge

volumes:
  postgres-data-prod:
  redis-data-prod:
  frontend-build:
