version: '3.8'

services:
  # Frontend сервис (Next.js)
  frontend:
    build:
      context: ./src/frontend
      dockerfile: ../../docker/Dockerfile.frontend
    container_name: happyness-frontend
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - backend
    restart: unless-stopped

  # Backend сервис (NestJS)
  backend:
    build:
      context: ./src/backend
      dockerfile: ../../docker/Dockerfile.backend
    container_name: happyness-backend
    volumes:
      - ./src/backend:/app
      - /app/node_modules
      - /app/dist
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/happyness
      - REDIS_URL=redis://redis:6379
      - PORT=4000
      - API_PREFIX=/api
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # База данных PostgreSQL
  postgres:
    image: postgres:17.5
    container_name: happyness-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./docker/postgres/backup.sh:/usr/local/bin/backup.sh
      - ./docker/postgres/restore.sh:/usr/local/bin/restore.sh
      - postgres_backups:/backups
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=happyness
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    restart: unless-stopped

  # Redis для кэширования
  redis:
    image: redis:8.0.1
    container_name: happyness-redis
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_backups:
  redis_data: 