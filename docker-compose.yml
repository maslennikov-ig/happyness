services:
  # Frontend сервис (Next.js)
  frontend:
    build:
      context: ./src/frontend
      dockerfile: ../../docker/Dockerfile.frontend
    container_name: happyness-frontend
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - happyness-network

  # Backend сервис (NestJS)
  backend:
    build:
      context: ./src/backend
      dockerfile: ../../docker/Dockerfile.backend
    container_name: happyness-backend
    volumes:
      - ./src/backend:/app
      - ./prisma:/app/prisma
      - /app/node_modules
      - /app/dist
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/happyness?schema=public
      - REDIS_URL=redis://redis:6379
      - PORT=4000
      - API_PREFIX=/api
      - CORS_ORIGIN=http://localhost:3000
      - JWT_SECRET=your-secret-key-change-in-production
      - JWT_EXPIRES_IN=7d
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - happyness-network
    command: sh -c "npx prisma generate && npm run start:backend:dev"

  # База данных PostgreSQL
  postgres:
    container_name: happyness-postgres
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: happyness
    ports:
      - '5432:5432'
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data
    networks:
      - happyness-network

  # Redis для кэширования
  redis:
    container_name: happyness-redis
    image: redis:7-alpine
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - happyness-network

networks:
  happyness-network:
    driver: bridge

volumes:
  postgres_data:
