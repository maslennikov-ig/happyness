version: '3.8'

services:
  # Frontend сервис (Next.js)
  frontend:
    build:
      context: ./src/frontend
      dockerfile: ../../docker/Dockerfile.frontend
    container_name: happyness-frontend
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - backend
    restart: unless-stopped

  # Backend сервис (NestJS)
  backend:
    build:
      context: ./src/backend
      dockerfile: ../../docker/Dockerfile.backend
    container_name: happyness-backend
    volumes:
      - ./src/backend:/app
      - /app/node_modules
      - /app/dist
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/happyness
      - REDIS_URL=redis://redis:6379
      - PORT=4000
      - API_PREFIX=/api
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # База данных PostgreSQL
  postgres:
    container_name: happyness-postgres
    image: postgres:17.5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: happyness
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - happyness-network

  # Redis для кэширования
  redis:
    container_name: happyness-redis
    image: redis:8.0.1
    ports:
      - "6379:6379"
    networks:
      - happyness-network

networks:
  happyness-network:
    driver: bridge

volumes:
  postgres_data: 