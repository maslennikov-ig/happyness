services:
  # Backend сервис (NestJS)
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: ${NODE_ENV:-dev}
    container_name: happyness-backend
    volumes:
      # DEV ONLY VOLUMES:
      - ./src/backend:/app
      - /app/node_modules
      - ./prisma:/app/prisma
      - ./src/backend/tsconfig.json:/app/tsconfig.json # dev only
      - ./src/backend/.eslintrc.js:/app/.eslintrc.js # dev only
      - ./src/backend/nest-cli.json:/app/nest-cli.json # dev only
      # - ./dist:/app/dist # отключено, чтобы не перекрывать сборку внутри контейнера
    ports:
      - '4000:4000'
      - '9229:9229' # Порт для отладки Node.js
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/happyness?schema=public
      - REDIS_URL=redis://redis:6379
      - PORT=${BACKEND_PORT:-4000}
      - API_PREFIX=${API_PREFIX:-/api}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3100}
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - DEBUG=${DEBUG:-false}
      - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - happyness-network
    command: sh -c "rm -rf dist/* && npx prisma generate && npm run start:backend:dev"
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:4000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3

  # База данных PostgreSQL
  postgres:
    container_name: happyness-postgres
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-happyness}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      LC_CTYPE: C.UTF-8
      LC_MESSAGES: C.UTF-8
      LC_MONETARY: C.UTF-8
      LC_NUMERIC: C.UTF-8
      LC_TIME: C.UTF-8
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - happyness-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis для кэширования
  redis:
    image: redis:7-alpine
    container_name: happyness-redis
    ports:
      - '6379:6379'
    command: redis-server --protected-mode no
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - ./.docker-data/redis:/data
    networks:
      - happyness-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # PGAdmin для управления базой данных (только для разработки)
  pgadmin:
    container_name: happyness-pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@happyness.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: ${PGADMIN_CONFIG_SERVER_MODE:-False}
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    volumes:
      - ./.docker-data/pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - happyness-network
    profiles:
      - dev
      - tools

  # Adminer как легкая альтернатива pgAdmin
  adminer:
    container_name: happyness-adminer
    image: adminer
    restart: always
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha
    depends_on:
      - postgres
    networks:
      - happyness-network
    profiles:
      - dev
      - tools

  # Redis Commander для управления Redis (только для разработки)
  redis-commander:
    container_name: happyness-redis-commander
    image: rediscommander/redis-commander:latest
    restart: always
    environment:
      REDIS_HOSTS: ${REDIS_COMMANDER_HOSTS:-local:redis:6379}
    ports:
      - '${REDIS_COMMANDER_PORT:-8081}:8081'
    depends_on:
      - redis
    networks:
      - happyness-network
    profiles:
      - dev
      - tools

networks:
  happyness-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  redis-commander-data:
