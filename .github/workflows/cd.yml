name: CD

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm run test

      # Здесь будут шаги деплоя на сервер
      # Для примера используем имитацию деплоя
      - name: Prepare for deployment
        run: |
          echo "Preparing deployment package..."
          mkdir -p deployment
          cp -r dist deployment/
          cp -r .next deployment/
          cp package*.json deployment/
          cp prisma/schema.prisma deployment/
          echo "Deployment package prepared"

      - name: Deploy to production
        run: |
          echo "Deploying to production server..."
          # Здесь будет реальный код деплоя, например через SSH или к облачному провайдеру
          # Для примера просто выводим сообщение об успешном деплое
          echo "Application successfully deployed to production"
